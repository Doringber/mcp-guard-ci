[project]
name = "mcp-guard-ci"
version = "0.1.0"
description = "CI guard for MCP servers, skills and plugins: functional smoke tests, security scans, one SARIF report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "mcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_guard"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that shell out to npx @modelcontextprotocol/inspector and mcp-scanner",
]
